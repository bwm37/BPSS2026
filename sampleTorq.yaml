              - name: us-docker.pkg.dev/stackpulse/public/defender_endpoint/run-advanced-query:2.1.0
                id: run_advanced_query_total_visitcount
                env:
                  DEFENDER_ACCESS_TOKEN: '{{ $.create_session_for_defender.api_object.access_token }}'
                  QUERY: "let StartTime = datetime({{ $.get_date_ai_report_start.result }});

                    let EndTime = datetime({{
                    $.get_date_ai_report_end.result }});

                    let Domains = dynamic([

                    \    \"lovable.dev\",

                    \    \"bolt.new\",

                    \    \"v0.dev\",

                    \    \"base44.com\",

                    \    \"dazl.dev\",

                    \    \"tempo.new\",

                    \    \"emergent.sh\",

                    \    \"app.emergent.sh\",

                    \    \"cursor.com\",

                    \    \"windsurf.com\",

                    \    \"trae.ai\",

                    \    \"kiro.dev\",

                    \    \"rosebud.ai\",

                    \    \"bubble.io\",

                    \    \"webflow.com\",

                    \    \"glideapps.com\",

                    \    \"softr.io\",

                    \    \"flutterflow.io\",

                    \    \"adalo.com\",

                    \    \"draftbit.com\",

                    \    \"weweb.io\",

                    \    \"replit.com\",

                    \    \"replit.app\",

                    \    \"stackblitz.com\",

                    \    \"antigravity.google\",

                    \    \"usegalileo.ai\",

                    \    \"magicpatterns.com\",

                    \    \"uizard.io\",

                    \    \"builder.io\",

                    \    \"locofy.ai\",

                    \    \"animaapp.com\",

                    \    \"relume.io\",

                    \    \"framer.com\",

                    \    \"retool.com\",

                    \    \"appsmith.com\",

                    \    \"tooljet.com\",

                    \    \"budibase.com\",

                    \    \"outsystems.com\",

                    \    \"mendix.com\",

                    \    \"powerapps.microsoft.com\",

                    \    \"wix.com\",

                    \    \"hostinger.com\",

                    \    \"hex.tech\",

                    \    \"streamlit.io\",

                    \    \"gradio.app\",

                    \    \"superblocks.com\",

                    \    \"observablehq.com\"

                    ]);

                    DeviceNetworkEvents

                    | where Timestamp between (StartTime ..
                    EndTime)

                    | where isnotempty(RemoteUrl)

                    | extend UrlLower = tolower(RemoteUrl)

                    | mv-expand Domain = Domains

                    | extend Domain = tostring(Domain)

                    | where UrlLower contains Domain

                    | summarize\ 

                    \    VisitCount = count(),

                    \    DeviceCount = dcount(DeviceName),

                    \    Devices = make_set(DeviceName, 100)

                    \    by Domain

                    | project Domain, VisitCount,
                    DeviceCount

                    | order by VisitCount desc"
                uuid: ba3052ed-7b3e-4be2-b947-5d668d36f35a
                pretty_name: Run Advanced Query Total VisitCount
                options:
                  executor:
                    name: http_request_v_4_2_4
