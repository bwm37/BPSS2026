                      REQUIRED_VARIABLES: '["DEFENDER_ACCESS_TOKEN", "QUERY"]'
                      TIMEOUT: "120"
                      TOKEN: '{{ .DEFENDER_ACCESS_TOKEN }}'
                      URL: https://api.securitycenter.microsoft.com/api/advancedqueries/run
                    sync: true
                    disable: false
                documentationUrl: https://learn.microsoft.com/en-us/microsoft-365/security/defender-endpoint/run-advanced-query-api?view=o365-worldwide#http-request
